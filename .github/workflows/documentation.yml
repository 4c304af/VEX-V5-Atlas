name: Synchronize official documentation

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-docs.txt
      - run: python tools/import_docs.py --refresh
      - name: Detect source changes
        id: changed
        shell: pwsh
        run: |
          $changed = [bool](git diff --name-only -- sources/en sources/manifest.json)
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - if: steps.changed.outputs.changed == 'true'
        run: python tools/build_docs.py
      - run: python tools/prepare_update_manifest.py
      - run: python tools/verify_docs.py
      - run: python tools/package_docs.py
      - name: Save synchronized sources
        if: steps.changed.outputs.changed == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/en sources/manifest.json sources/translation-cache.json public/docs
          git commit -m "Synchronize official VEX V5 C++ documentation"
          git push origin HEAD:main
      - run: python tools/publish_docs_feed.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
