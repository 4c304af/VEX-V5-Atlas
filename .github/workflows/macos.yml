name: macOS build

on:
  push:
    branches: [main, 'codex/macos-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:docs
      - run: npm run package:mac
      - run: npm run test:mac-core
      - run: npm run test:mac
      - uses: actions/upload-artifact@v4
        with:
          name: V5-Atlas-macOS-universal
          path: |
            release/V5-Atlas-*-macOS-universal.dmg
            release/V5-Atlas-*-macOS-universal.zip
            release/macOS-SHA256SUMS.txt
