name: macOS build

on:
  push:
    branches: [main, 'codex/macos-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:docs
      - run: npm run verify:rules
      - run: npm run package:mac
      - run: npm run test:mac-core
      - run: npm run test:mac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V5-Atlas-macOS-preview
          path: screenshots/macos-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: V5-Atlas-macOS-universal
          path: |
            release/V5-Atlas-*-macOS-universal.dmg
            release/V5-Atlas-*-macOS-universal.zip
            release/macOS-SHA256SUMS.txt

  test-intel:
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: V5-Atlas-macOS-universal
          path: release
      - name: Open the same universal application on Intel
        run: |
          mkdir -p build/macos
          python - <<'PY'
          import json, pathlib, subprocess
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          subprocess.run(['ditto', '-x', '-k', f'release/V5-Atlas-{version}-macOS-universal.zip', 'build/macos'], check=True)
          PY
      - run: python tools/test_macos.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V5-Atlas-macOS-preview-Intel
          path: screenshots/macos-*.png
          if-no-files-found: ignore
